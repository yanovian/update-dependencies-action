name: Update Dependencies (no token given to this Action)

# For supply-chain-sensitive setups that don't want to hand a third-party action any token: this
# Action only updates dependencies and writes the rendered pull request title and body to disk,
# with create-pull-request: false and no github-token. A later step, using only official GitHub
# actions, commits, pushes, and opens the pull request itself.
#
# The update-dependencies step must not have a GITHUB_TOKEN environment variable available to it
# for this to actually isolate token access; the actions/github-script step below is the only
# one that receives write permissions.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: update
        uses: yanovian/update-dependencies-action@v1
        with:
          update-strategy: non-breaking
          create-pull-request: false

      - name: Commit and push
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/update-deps/non-breaking
          git add -A
          git commit -m "${{ steps.update.outputs.pull-request-title }}"
          git push origin chore/update-deps/non-breaking --force

      - name: Open the pull request
        if: steps.update.outputs.updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.update.outputs.pull-request-body-path }}', 'utf8');
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'chore/update-deps/non-breaking',
              base: context.payload.repository.default_branch,
              title: '${{ steps.update.outputs.pull-request-title }}',
              body,
            });
