version: 1

# Turn an ecosystem off if you don't want it touched, even if this Action finds it in the repo.
# Anything not listed here is scanned automatically.
ecosystems:
  npm: true
  yarn: true
  pnpm: true
  pip: true
  cargo: true
  go: true
  maven: true
  gradle: true
  rubygems: true
  composer: true
  nuget: true
  github-actions: true

# Path prefixes, relative to the repo root, that this Action should skip entirely.
ignorePaths:
  - examples
  - test-fixtures

# Overrides the update-strategy input for one ecosystem. GitHub Actions default to breaking (a
# floating tag like v4 never moves past its major otherwise); set non-breaking to keep them within
# their current major.
updateStrategies:
  github-actions: breaking

# Only stable versions are used by default. An update to a version containing alpha, beta, rc,
# snapshot, etc. is walked back to the newest stable version. Set to true to allow them.
allowUnstableVersions: false
